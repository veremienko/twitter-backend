name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: twitter
                    POSTGRES_PASSWORD: twitter
                    POSTGRES_DB: twitter_test
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U twitter"
                    --health-interval 5s --health-timeout 3s --health-retries 10
            redis:
                image: redis:8-alpine
                ports: ['6380:6379']

        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 25
                  cache: npm
            - run: npm ci
            - run: cp .env.example .env
            - run: npx prettier --check .
            - run: |
                  cd services/twit-service                                                                                                                                                                             
                  DATABASE_URL=postgres://twitter:twitter@localhost:5432/twitter_test npx drizzle-kit migrate
            - run: npm test
